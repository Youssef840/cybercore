name: Build firmware

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CYBERCORE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            CYBERCORE/.pio/libdeps
          key: pio-${{ hashFiles('CYBERCORE/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build (cyd2usb)
        run: pio run -e cyd2usb
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cybercore-cyd2usb
          path: CYBERCORE/.pio/build/cyd2usb/*.bin
