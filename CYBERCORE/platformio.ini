; ============================================================================
;  CYBERCORE Firmware  -  ESP32 + TFT (TFT_eSPI) + CC1101 (receive-only)
; ============================================================================
;  Bus layout (no SPI conflicts):
;    HSPI  -> TFT display     (owned by TFT_eSPI, USE_HSPI_PORT)
;    VSPI  -> CC1101 radio    (owned by SmartRC lib through the global SPI)
;  Board profiles:
;    cyd2usb : ESP32-2432S028R "Cheap Yellow Display" (2 USB) - touch input
;    ili9341 / st7789 : generic ESP32 DevKit + wired TFT + 4 buttons
;  See README.md for the full wiring tables.
; ============================================================================

[platformio]
default_envs = cyd2usb

; ---------------------------------------------------------------- common ----
[env]
; Arduino-ESP32 core 2.0.17. TFT_eSPI is not yet stable on core 3.x.
platform        = espressif32@6.9.0
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, colorize
board_build.partitions = huge_app.csv
extra_scripts   = pre:scripts/fix_spi_symbol.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lsatan/SmartRC-CC1101-Driver-Lib@2.5.7
    ricmoo/QRCode@0.0.1
    https://github.com/marian-craciunescu/ESP32Ping.git

build_flags =
    -O2
    -I src
    -D CORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI: configured here instead of editing User_Setup.h ----
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=4000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

; ------------------------------- ESP32-2432S028R (CYD, 2 USB ports) ------
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -D BOARD_CYD=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D DISPLAY_ROTATION=3

; ------------------- Arabic font render proof (flash, look, move on) ------
[env:cyd2usb_fonttest]
extends = env:cyd2usb
build_flags = ${env:cyd2usb.build_flags} -D AR_FONT_TEST=1
build_src_filter = -<*> +<FontTest.cpp> +<ui/Font.cpp> +<ui/ArabicText.cpp> +<ui/Theme.cpp>

; ------------------------- generic DevKit + ILI9341 2.4"/2.8" 240x320 ----
[env:ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=27
    -D TFT_RST=33
    -D TFT_BL=32
    -D DISPLAY_ROTATION=1

; --------------------------- generic DevKit + ST7789 2.0"/2.4" 240x320 ---
[env:st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_RGB
    ; Some ST7789 panels need colour inversion; remove if colours look wrong.
    -D TFT_INVERSION_ON=1
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=27
    -D TFT_RST=33
    -D TFT_BL=32
    -D DISPLAY_ROTATION=1
